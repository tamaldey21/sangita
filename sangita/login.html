<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - For Sangita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Special Access</h1>
        </div>
        
        <div class="login-container">
            <h2>For My Dearest Sangita</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your name" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <div class="hint">
                <p>Hint: Your username is "sangita" and password is "mylove"</p>
            </div>
        </div>
        
        <div class="back-button">
            <button onclick="location.href='index.html'">Back to Main Page</button>
        </div>
        
        <div class="footer">
            <p>Made with ❤️ for Sangita</p>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories - Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Our Beautiful Memories</h1>
        </div>
        
        <div class="gallery-container">
            <div class="photo-grid">
                <div class="photo-item">
                    <div class="placeholder-image">Photo 1</div>
                    <p>Our first meeting</p>
                </div>
                
                <div class="photo-item">
                    <div class="placeholder-image">Photo 2</div>
                    <p>A special moment</p>
                </div>
                
                <div class="photo-item">
                    <div class="placeholder-image">Photo 3</div>
                    <p>Together forever</p>
                </div>
                
                <div class="photo-item">
                    <div class="placeholder-image">Photo 4</div>
                    <p>Happy times</p>
                </div>
                
                <div class="photo-item">
                    <div class="placeholder-image">Photo 5</div>
                    <p>Love is in the air</p>
                </div>
                
                <div class="photo-item">
                    <div class="placeholder-image">Photo 6</div>
                    <p>Forever and always</p>
                </div>
            </div>
            
            <div class="upload-section">
                <h3>Add New Memory</h3>
                <p>(This is where you can upload photos in a full implementation)</p>
            </div>
        </div>
        
        <div class="back-button">
            <button onclick="location.href='index.html'">Back to Main Page</button>
        </div>
        
        <div class="footer">
            <p>Made with ❤️ for Sangita</p>
        </div>
    </div>
</body>
</html>
